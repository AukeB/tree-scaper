[project]
name = "tree-scaper"
version = "0.1.0"
description = "Repository for visualizing tree and forest structures with hierarchical nodes and branches, featuring dynamic layouts, using Python and PyGame."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12.5",
    "pygame>=2.6.1",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "docstring-tailor>=0.4.1",
    "pyright>=1.1.414",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.14.11",
    "ty>=0.0.29",
]

# Build system and backend.

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tree_scaper"
module-root = "src"

# Pytest settings.

[tool.pytest.ini_options]
pythonpath = ["."]

# Dependency checker settings.

[tool.deptry]
known_first_party = ["tree_scaper"]

# Docstring tailor settings.

[tool.docstring_tailor]
line-length = 88
style = "google"
detect-lists = true

# Ruff settings.

[tool.ruff.lint]
extend-select = ["I", "ANN"]

[tool.ruff.lint.isort]
known-first-party = ["tree_scaper"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "I001"]  # tests are not held to annotation rules or import sorting
